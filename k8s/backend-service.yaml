# Backend Service
#
# Educational Note:
# Exposes the backend API within the cluster.

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wizards-keep
  labels:
    app: backend
    tier: application
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: backend
