# PostgreSQL Database Secret
#
# Educational Note:
# Secrets store sensitive data like passwords.
# Values are base64 encoded (not encrypted!).
# In production, use a proper secrets management solution.
#
# To generate base64: echo -n "wizard123" | base64

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: wizards-keep
  labels:
    app: database
type: Opaque
data:
  # wizard123 in base64
  POSTGRES_PASSWORD: d2l6YXJkMTIz
