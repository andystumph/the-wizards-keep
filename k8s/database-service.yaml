# PostgreSQL Service
#
# Educational Note:
# Services provide stable networking for pods.
# ClusterIP makes the service accessible within the cluster.

apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: wizards-keep
  labels:
    app: database
    tier: data
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: database
